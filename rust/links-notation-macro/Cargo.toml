[package]
name = "links-notation-macro"
version = "0.1.1"
edition = "2021"
rust-version = "1.87"
description = "Procedural macro for Links Notation compile-time parsing"
license = "Unlicense"
repository = "https://github.com/link-foundation/links-notation"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3.0.6", features = ["full", "extra-traits"] }
quote = "1.0.47"
proc-macro2 = "1.0.107"
