version: 2
updates:
  # JavaScript dependencies
  - package-ecosystem: "npm"
    directories: ["/js", "/docs/website", "/docs/comparison", "/benchmarks/js", "/benchmarks/tools"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"

  # Python dependencies
  - package-ecosystem: "pip"
    directories: ["/python", "/benchmarks/python", "/scripts/ci"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"

  # C# dependencies
  - package-ecosystem: "nuget"
    directories: ["/csharp", "/benchmarks/csharp"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "csharp"
    commit-message:
      prefix: "chore(deps)"

  # Java dependencies
  - package-ecosystem: "maven"
    directories: ["/java", "/benchmarks/java"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "chore(deps)"

  # PHP dependencies
  - package-ecosystem: "composer"
    directories: ["/php", "/benchmarks/php"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "php"
    commit-message:
      prefix: "chore(deps)"

  # Go dependencies (the module has none today; this keeps the go directive and
  # any future require block from going stale)
  - package-ecosystem: "gomod"
    directories: ["/go", "/benchmarks/go"]
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
