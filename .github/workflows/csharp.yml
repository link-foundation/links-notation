name: csharp

on:
  push:
    branches: main
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp.yml'
  pull_request:
    paths:
      - 'csharp/**'
      - '.github/workflows/csharp.yml'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Print extra diagnostics (never secret values)'
        type: boolean
        required: false
        default: false

# Least privilege by default; the two jobs that write to the repository
# raise it to `contents: write` for themselves only.
permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Opt-in diagnostics, off unless a maintainer dispatches with verbose=true
  # or sets the CI_VERBOSE repository variable.
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}
  PACKAGE_ID: Link.Foundation.Links.Notation
  PROJECT_PATH: Link.Foundation.Links.Notation/Link.Foundation.Links.Notation.csproj

defaults:
  run:
    working-directory: csharp

jobs:
  findChangedCsFiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      isCsFilesChanged: ${{ steps.setIsCsFilesChangedOutput.outputs.isCsFilesChanged }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Get changed files using defaults
        id: changed-files
        uses: tj-actions/changed-files@v47
      - name: Set output isCsFilesChanged
        id: setIsCsFilesChangedOutput
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          isCsFilesChanged='false'
          # workflow_dispatch has no diff to inspect, so treat it as "changed".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            isCsFilesChanged='true'
          fi
          echo "Changed files: $ALL_CHANGED_FILES"
          for changedFile in $ALL_CHANGED_FILES; do
            if [[ $changedFile == csharp/* ]] || [[ $changedFile == .github/workflows/csharp.yml ]]; then
              isCsFilesChanged='true'
              break
            fi
          done
          echo "isCsFilesChanged=${isCsFilesChanged}" >> $GITHUB_OUTPUT
          echo "isCsFilesChanged: ${isCsFilesChanged}"

  lint:
    needs: [findChangedCsFiles]
    if: ${{ needs.findChangedCsFiles.outputs.isCsFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore Dependencies
        run: dotnet restore
      - name: Check formatting
        run: |
          if [ "$CI_VERBOSE" = "true" ]; then
            dotnet format --verify-no-changes --verbosity diagnostic
          else
            dotnet format --verify-no-changes
          fi

  test:
    needs: [findChangedCsFiles, lint]
    if: ${{ needs.findChangedCsFiles.outputs.isCsFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Restore Dependencies
        run: dotnet restore
      - name: Build
        # Warnings are annotated but the build stays green; -warnaserror is a
        # separate decision that would also fail on new analyzer releases.
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build -f net8

  pushToNuget:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [findChangedCsFiles, test]
    if: ${{ needs.findChangedCsFiles.outputs.isCsFilesChanged == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: ${{ github.workflow }}-publish-nuget
      cancel-in-progress: false
    outputs:
      # 'true' published now, 'skipped' nothing to do, 'failed' credential missing.
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version-check.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Check if version already published to NuGet.org
        id: version-check
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' "$PROJECT_PATH")
          if [ -z "$PACKAGE_VERSION" ]; then
            echo "::error::Could not read <VersionPrefix> from $PROJECT_PATH"
            exit 1
          fi
          PACKAGE_ID_LOWER=$(echo "$PACKAGE_ID" | tr '[:upper:]' '[:lower:]')
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "package_id_lower=$PACKAGE_ID_LOWER" >> $GITHUB_OUTPUT
          echo "Package: $PACKAGE_ID@$PACKAGE_VERSION"

          # Flat-container URLs are lowercase-only.
          if curl -fsS "https://api.nuget.org/v3-flatcontainer/$PACKAGE_ID_LOWER/$PACKAGE_VERSION/$PACKAGE_ID_LOWER.nuspec" > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already exists on NuGet.org"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION does not exist on NuGet.org"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
      - name: Pack
        if: steps.version-check.outputs.should_publish == 'true'
        run: dotnet pack "$PROJECT_PATH" --configuration Release --output artifacts
      - name: Publish NuGet package
        id: publish
        env:
          # NuGet.org has no OIDC trusted publishing yet, so an API key is the
          # only option. Accept either name; NUGET_TOKEN is the historical one.
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ steps.version-check.outputs.should_publish }}" != "true" ]; then
            echo "published=skipped" >> $GITHUB_OUTPUT
            echo "::notice::Version ${{ steps.version-check.outputs.version }} is already on NuGet.org, nothing to publish"
            exit 0
          fi

          API_KEY="${NUGET_API_KEY:-$NUGET_TOKEN}"
          # Report presence, never the value.
          if [ -z "$API_KEY" ]; then
            echo "published=failed" >> $GITHUB_OUTPUT
            echo "::warning::Neither NUGET_API_KEY nor NUGET_TOKEN is configured; skipping the NuGet push. No GitHub release will be created."
            exit 0
          fi
          echo "NuGet credential: present"

          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "published=true" >> $GITHUB_OUTPUT
      - name: Verify the package is really on NuGet.org
        if: steps.publish.outputs.published == 'true'
        env:
          PACKAGE_ID_LOWER: ${{ steps.version-check.outputs.package_id_lower }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          # NuGet.org indexes asynchronously; poll rather than assume success.
          for attempt in $(seq 1 20); do
            if curl -fsS "https://api.nuget.org/v3-flatcontainer/${PACKAGE_ID_LOWER}/index.json" \
                 | grep -q "\"${PACKAGE_VERSION}\""; then
              echo "Verified ${PACKAGE_ID}@${PACKAGE_VERSION} on NuGet.org (attempt ${attempt})"
              exit 0
            fi
            echo "Not indexed yet, retrying in 30s (attempt ${attempt}/20)"
            sleep 30
          done
          echo "::error::${PACKAGE_ID}@${PACKAGE_VERSION} did not appear on NuGet.org within 10 minutes"
          exit 1

  generatePdfWithCode:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [findChangedCsFiles, test]
    if: ${{ needs.findChangedCsFiles.outputs.isCsFilesChanged == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pdf
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies for PDF generation
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-lang-cyrillic texlive-latex-extra python3-pygments ghostscript python-is-python3
      - name: Generate PDF with code
        run: |
          if [ "$CI_VERBOSE" = "true" ]; then set -x; fi
          bash scripts/generate-pdf.sh
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: csharp-pdf
          path: csharp/_site/Link.Foundation.Links.Notation.pdf
          retention-days: 1

  publishDocumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [findChangedCsFiles, test, generatePdfWithCode]
    if: ${{ needs.findChangedCsFiles.outputs.isCsFilesChanged == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Pushing to gh-pages is a write to this repository.
    permissions:
      contents: write
    # gh-pages has a single head; two concurrent deploys would race.
    concurrency:
      group: ${{ github.workflow }}-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Download PDF artifact
        uses: actions/download-artifact@v8
        with:
          name: csharp-pdf
          path: csharp/pdf-artifact
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Install DocFX
        run: |
          dotnet tool install -g docfx
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Publish documentation to gh-pages branch
        run: |
          if [ "$CI_VERBOSE" = "true" ]; then
            set -x
            docfx --version
          fi
          bash scripts/publish-docs.sh

  publishRelease:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately not `needs: publishDocumentation`: a DocFX failure must not
    # withhold the release for a package that is already on NuGet.org.
    needs: [findChangedCsFiles, pushToNuget]
    # Gate on what actually happened, not on the job result: a job that skipped
    # its publish step (missing credential, or nothing new to push) still
    # reports `success`, which is how green runs shipped no package at all.
    if: ${{ needs.findChangedCsFiles.outputs.isCsFilesChanged == 'true' && needs.pushToNuget.outputs.published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          submodules: true
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_VERSION: ${{ needs.pushToNuget.outputs.version }}
        run: |
          set -euo pipefail
          # Consistent tag format across every language: <language>_<version>.
          TAG="csharp_${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          RELEASE_NOTES=$(sed -n 's|.*<PackageReleaseNotes>\(.*\)|\1|p' "$PROJECT_PATH" | head -1)
          gh release create "$TAG" \
            --title "[C#] $PACKAGE_VERSION" \
            --notes "https://www.nuget.org/packages/${PACKAGE_ID}/${PACKAGE_VERSION}

          ${RELEASE_NOTES}"
