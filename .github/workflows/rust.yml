name: rust

on:
  push:
    branches: main
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Print extra diagnostics (never secret values)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

defaults:
  run:
    working-directory: rust

jobs:
  findChangedRustFiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      isRustFilesChanged: ${{ steps.setIsRustFilesChangedOutput.outputs.isRustFilesChanged }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get changed files using defaults
        id: changed-files
        uses: tj-actions/changed-files@v47
      - name: Set output isRustFilesChanged
        id: setIsRustFilesChangedOutput
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          isRustFilesChanged='false'
          # workflow_dispatch has no diff to inspect, so treat it as "changed".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            isRustFilesChanged='true'
          fi
          echo "Changed files: $ALL_CHANGED_FILES"
          for changedFile in $ALL_CHANGED_FILES; do
            if [[ $changedFile == rust/* ]] || [[ $changedFile == .github/workflows/rust.yml ]]; then
              isRustFilesChanged='true'
              break
            fi
          done
          echo "isRustFilesChanged=${isRustFilesChanged}" >> $GITHUB_OUTPUT
          echo "isRustFilesChanged: ${isRustFilesChanged}"

  lint:
    needs: [findChangedRustFiles]
    if: ${{ needs.findChangedRustFiles.outputs.isRustFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Replaces three hand-rolled actions/cache steps. Those keyed only on
      # Cargo.lock, had no restore-keys (so any lockfile edit was a total
      # miss), and cached `target` without the compiler version in the key,
      # which silently poisons the cache across toolchain updates.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    needs: [findChangedRustFiles, lint]
    if: ${{ needs.findChangedRustFiles.outputs.isRustFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test

  publishToCratesIO:
    needs: [findChangedRustFiles, test]
    if: ${{ needs.findChangedRustFiles.outputs.isRustFilesChanged == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-publish-crates-io
      cancel-in-progress: false
    permissions:
      contents: read
      # Required by rust-lang/crates-io-auth-action (RFC 3691 trusted publishing).
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
      name: ${{ steps.publish.outputs.name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build
        run: cargo build --release
      # Exchanges the workflow's OIDC identity for a short-lived crates.io
      # token. Returns an empty token when trusted publishing is not
      # configured for the crate, which the publish step reports explicitly.
      - name: Authenticate to crates.io
        id: cratesio-auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish to crates.io
        id: publish
        env:
          # Prefer the short-lived OIDC token; fall back to the long-lived
          # secret for as long as trusted publishing is not configured.
          OIDC_TOKEN: ${{ steps.cratesio-auth.outputs.token }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          set -euo pipefail

          read_field() { grep "^$2 = " "$1" | head -1 | sed "s/$2 = \"\(.*\)\"/\1/"; }
          MACRO_VERSION=$(read_field links-notation-macro/Cargo.toml version)
          PACKAGE_NAME=$(read_field links-notation/Cargo.toml name)
          PACKAGE_VERSION=$(read_field links-notation/Cargo.toml version)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT

          # The token never appears on the command line, where it would be
          # visible to every other process on the runner via /proc.
          export CARGO_REGISTRY_TOKEN="${OIDC_TOKEN:-$CARGO_TOKEN}"
          if [ -n "${OIDC_TOKEN:-}" ]; then
            echo "crates.io credential: trusted publishing (OIDC)"
          elif [ -n "${CARGO_TOKEN:-}" ]; then
            echo "crates.io credential: CARGO_TOKEN present"
          else
            echo "published=failed" >> $GITHUB_OUTPUT
            echo "::warning::No crates.io credential (neither trusted publishing nor CARGO_TOKEN); skipping publish. No GitHub release will be created."
            exit 0
          fi

          publish_crate() {
            local crate="$1" version="$2" log="$3"
            if cargo publish -p "$crate" 2>&1 | tee "$log"; then
              echo "Published ${crate}@${version}"
              return 0
            fi
            if grep -q "already exists on crates.io index" "$log"; then
              echo "${crate}@${version} is already on crates.io"
              return 2
            fi
            echo "::error::Failed to publish ${crate}@${version}"
            return 1
          }

          # The main crate depends on links-notation-macro, so that one has to
          # land, and be visible in the index, first.
          set +e
          publish_crate links-notation-macro "$MACRO_VERSION" macro_publish.log
          MACRO_STATUS=$?
          set -e
          if [ $MACRO_STATUS -eq 1 ]; then exit 1; fi

          if [ $MACRO_STATUS -eq 0 ]; then
            for attempt in $(seq 1 20); do
              if curl -fsS "https://crates.io/api/v1/crates/links-notation-macro/${MACRO_VERSION}" >/dev/null 2>&1; then
                echo "links-notation-macro@${MACRO_VERSION} is visible in the index"
                break
              fi
              echo "Waiting for the index to catch up (attempt ${attempt}/20)"
              sleep 15
            done
          fi

          set +e
          publish_crate "$PACKAGE_NAME" "$PACKAGE_VERSION" publish.log
          STATUS=$?
          set -e
          case $STATUS in
            0) echo "published=true" >> $GITHUB_OUTPUT ;;
            2) echo "published=skipped" >> $GITHUB_OUTPUT ;;
            *) echo "published=failed" >> $GITHUB_OUTPUT; exit 1 ;;
          esac
      - name: Verify the crate is really on crates.io
        if: steps.publish.outputs.published == 'true'
        env:
          PACKAGE_NAME: ${{ steps.publish.outputs.name }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS "https://crates.io/api/v1/crates/${PACKAGE_NAME}/${PACKAGE_VERSION}" >/dev/null 2>&1; then
              echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} on crates.io (attempt ${attempt})"
              exit 0
            fi
            echo "Not visible yet, retrying in 15s (attempt ${attempt}/20)"
            sleep 15
          done
          echo "::error::${PACKAGE_NAME}@${PACKAGE_VERSION} did not appear on crates.io within 5 minutes"
          exit 1

  publishRelease:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [findChangedRustFiles, publishToCratesIO]
    # See csharp.yml: `result == 'success'` is true for a job that published
    # nothing, so the gate is the explicit `published` output instead.
    if: ${{ needs.findChangedRustFiles.outputs.isRustFilesChanged == 'true' && needs.publishToCratesIO.outputs.published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_NAME: ${{ needs.publishToCratesIO.outputs.name }}
          PACKAGE_VERSION: ${{ needs.publishToCratesIO.outputs.version }}
        run: |
          set -euo pipefail
          TAG="rust_${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "[Rust] $PACKAGE_VERSION" \
            --notes "https://crates.io/crates/$PACKAGE_NAME"
