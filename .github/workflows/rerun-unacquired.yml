name: rerun-unacquired

# Re-runs a CI run whose failure is a job that no hosted runner ever picked up
# (issue #377), using scripts/ci/rerun-unacquired.py. On main, `kotlin / ios`
# was cancelled after 37 minutes in the macos-26 queue, so the release job was
# skipped and nothing was published, though no test had failed.
#
# workflow_run is safe here: this workflow checks out only the default branch,
# runs nothing from the triggering run, reads that run through the API and can
# only ask GitHub to re-run it. Runs from forks are ignored.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      # `gh run rerun --failed` and the job and annotation lookups.
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Re-run jobs that no runner picked up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_VERBOSE: ${{ vars.CI_VERBOSE || 'false' }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python3 scripts/ci/rerun-unacquired.py
          --repository "$REPOSITORY" --run-id "$RUN_ID" --attempt "$ATTEMPT"
