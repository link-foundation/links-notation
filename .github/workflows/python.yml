name: python

on:
  workflow_call:
    inputs:
      verbose:
        description: "Print extra diagnostics (never secret values)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

defaults:
  run:
    working-directory: python

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-python-${{ github.ref }}-lint
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Python 3.15
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip==26.3
          pip install --require-hashes -r requirements.lock -r ../scripts/ci/requirements.lock
          pip install --no-deps -e .
      - name: Check reproducible Python resolution
        run: |
          uv lock --check
          uv lock --project ../dev/log/issues/330/pulls/331/templates/python --check
          uv lock --project ../dev/log/issues/377/pulls/378/templates/python --check
      - name: Check formatting with Black
        run: black --check --diff .
      - name: Check import sorting with isort
        run: isort --check-only --diff .
      - name: Lint with flake8
        run: flake8 --max-line-length=120
      # The package ships py.typed (issue #411), so its annotations are part
      # of the public API; [tool.mypy] in pyproject.toml sets the flags.
      - name: Type-check the package with mypy
        run: mypy

  test:
    needs: [lint]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The requires-python floor and the newest release.
        python-version: ["3.11", "3.15.2"]
    concurrency:
      group: ci-python-${{ github.ref }}-test-${{ matrix.python-version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.3
          pip install --require-hashes -r requirements.lock -r ../scripts/ci/requirements.lock
          pip install --no-deps -e .
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
      - name: Check that the wheel and sdist ship py.typed
        run: python tests/check_distributions.py dist
      # A consumer sees only the installed wheel: install it into its own
      # environment and type-check a copy of the consumer outside the source
      # tree, so mypy cannot fall back to the checkout (issue #411).
      - name: Type-check a consumer of the installed wheel
        env:
          CONSUMER: ${{ runner.temp }}/typed-consumer
        run: |
          python -m venv "$CONSUMER/venv"
          "$CONSUMER/venv/bin/python" -m pip install --no-deps dist/*.whl
          cp tests/typed_consumer.py "$CONSUMER/"
          cd "$CONSUMER"
          mypy --strict --no-incremental --python-executable "$CONSUMER/venv/bin/python" typed_consumer.py
          "$CONSUMER/venv/bin/python" typed_consumer.py
      - name: Run tests
        run: pytest -v
