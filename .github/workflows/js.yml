name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      verbose:
        description: "Print extra diagnostics (never secret values)"
        type: boolean
        default: false

permissions:
  contents: read

# One commit range at a time; drafting agents never push during a run.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  js:
    uses: ./.github/workflows/javascript.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  rust:
    needs: [js]
    uses: ./.github/workflows/rust.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  python:
    needs: [js]
    uses: ./.github/workflows/python.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  java:
    needs: [js]
    uses: ./.github/workflows/java.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  go:
    needs: [js]
    uses: ./.github/workflows/go.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  csharp:
    needs: [js]
    uses: ./.github/workflows/csharp.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  php:
    needs: [js]
    uses: ./.github/workflows/php.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  cpp:
    needs: [js]
    uses: ./.github/workflows/cpp.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  swift:
    needs: [js]
    uses: ./.github/workflows/swift.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  kotlin:
    needs: [js]
    uses: ./.github/workflows/kotlin.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  binary_interop:
    needs: [js]
    uses: ./.github/workflows/binary-interop.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  benchmarks:
    needs: [js]
    uses: ./.github/workflows/benchmarks.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    permissions:
      contents: write
      pull-requests: write
      actions: write

  security:
    needs: [js]
    uses: ./.github/workflows/security.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    permissions:
      contents: write
      security-events: write
      pull-requests: write

  docs:
    needs: [js]
    uses: ./.github/workflows/docs.yml
    with:
      verbose: ${{ inputs.verbose || false }}

  release:
    needs: [js, rust, python, java, go, csharp, php, cpp, swift, kotlin]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    permissions:
      contents: write
      id-token: write

  # Warehouse matches job_workflow_ref, so mint here to use the saved js.yml
  # publisher. A nested reusable job presents its callee's workflow identity.
  publish_python:
    needs: [js, rust, python, java, go, csharp, php, cpp, swift, kotlin]
    defaults:
      run:
        working-directory: python
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    # Must outlast the 10 minute registry wait below plus the build.
    timeout-minutes: 25
    concurrency:
      group: ci-python-publish-pypi
      cancel-in-progress: false
    permissions:
      contents: read
      # Required for PyPI trusted publishing.
      id-token: write
    env:
      CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version-check.outputs.version }}
      name: ${{ steps.version-check.outputs.name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.0"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine pypi-attestations
      - name: Build package
        run: python -m build
      - name: Check if version already published
        id: version-check
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/registry-probe.sh
          . "$GITHUB_WORKSPACE/scripts/ci/registry-probe.sh"
          read -r PACKAGE_NAME PACKAGE_VERSION <<<"$(python -c "
          import tomllib
          with open('pyproject.toml','rb') as f:
              p = tomllib.load(f)['project']
          print(p['name'], p['version'])
          ")"
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Package: $PACKAGE_NAME@$PACKAGE_VERSION"

          # The JSON API is an exact lookup. The previous `pip index versions |
          # grep` matched substrings, so 0.1.0 looked published once 0.1.0.1
          # existed.
          if probe_registry "https://pypi.org/pypi/${PACKAGE_NAME}/${PACKAGE_VERSION}/json"; then
            echo "Version $PACKAGE_VERSION already exists on PyPI"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$REGISTRY_PROBE_STATUS" != "404" ]; then
              echo "::error::Registry presence is unknown (HTTP $REGISTRY_PROBE_STATUS); refusing publication"
              exit 1
            fi
            echo "Version $PACKAGE_VERSION does not exist on PyPI"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Explicit OIDC-first selection avoids the empty-string &&/|| trap.
      # Credential retries reuse python/dist; attestations remain on OIDC uploads.
      - name: Publish to PyPI
        id: publish
        env:
          SHOULD_PUBLISH: ${{ steps.version-check.outputs.should_publish }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
          PYPI_TRUSTED_PUBLISHING: ${{ vars.PYPI_TRUSTED_PUBLISHING != 'false' }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: node "$GITHUB_WORKSPACE/scripts/ci/publish-package.mjs" pypi
      - name: Verify the package is really on PyPI
        if: steps.publish.outputs.published == 'true' || steps.publish.outputs.published == 'skipped'
        env:
          PACKAGE_NAME: ${{ steps.version-check.outputs.name }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/ci/registry-probe.sh
          . "$GITHUB_WORKSPACE/scripts/ci/registry-probe.sh"
          # 0.23.0 took over a minute to appear, half of the old 150
          # second window (issue #330). 40 x 15s = 10 minutes.
          wait_for_registry \
            "${PACKAGE_NAME}@${PACKAGE_VERSION} on PyPI" \
            "https://pypi.org/pypi/${PACKAGE_NAME}/${PACKAGE_VERSION}/json" 40 15

  python_release:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: [publish_python]
    # See csharp.yml: gate on what was published, not on the job result.
    if: ${{ (needs.publish_python.outputs.published == 'true' || needs.publish_python.outputs.published == 'skipped') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          PACKAGE_NAME: ${{ needs.publish_python.outputs.name }}
          PACKAGE_VERSION: ${{ needs.publish_python.outputs.version }}
        run: |
          set -euo pipefail
          TAG="python_${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$RELEASE_SHA" \
            --title "[Python] $PACKAGE_VERSION" \
            --notes "https://pypi.org/project/$PACKAGE_NAME/$PACKAGE_VERSION/"

  # Runs after a failed, skipped or cancelled release too, so main reports
  # what is missing; release-result distinguishes skipped publication from
  # partial delivery. always(), not the usual
  # !cancelled(), on purpose: this job only reads the registries, and a run
  # cancelled mid-publication is a partial delivery the audit must report.
  # scripts/ci/check-js-gate.mjs requires this exact condition.
  release_audit:
    needs: [js, rust, python, java, go, csharp, php, cpp, swift, kotlin, release, publish_python, python_release]
    if: ${{ always() && needs.js.result == 'success' }}
    uses: ./.github/workflows/release-audit.yml
    with:
      verbose: ${{ inputs.verbose || false }}
      release-result: >-
        ${{ (needs.release.result == 'failure' || needs.publish_python.result == 'failure' || needs.python_release.result == 'failure') && 'failure' ||
            (needs.release.result == 'cancelled' || needs.publish_python.result == 'cancelled' || needs.python_release.result == 'cancelled') && 'cancelled' ||
            needs.release.result }}

  js_check:
    name: JavaScript
    needs: [js]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.js.result }}
        run: test "$STAGE_RESULT" = success

  rust_check:
    name: Rust
    needs: [rust]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.rust.result }}
        run: test "$STAGE_RESULT" = success

  python_check:
    name: Python
    needs: [python]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.python.result }}
        run: test "$STAGE_RESULT" = success

  java_check:
    name: Java
    needs: [java]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.java.result }}
        run: test "$STAGE_RESULT" = success

  go_check:
    name: Go
    needs: [go]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.go.result }}
        run: test "$STAGE_RESULT" = success

  csharp_check:
    name: CSharp
    needs: [csharp]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.csharp.result }}
        run: test "$STAGE_RESULT" = success

  php_check:
    name: PHP
    needs: [php]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.php.result }}
        run: test "$STAGE_RESULT" = success

  cpp_check:
    name: Cpp
    needs: [cpp]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.cpp.result }}
        run: test "$STAGE_RESULT" = success

  swift_check:
    name: Swift
    needs: [swift]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.swift.result }}
        run: test "$STAGE_RESULT" = success

  kotlin_check:
    name: Kotlin
    needs: [kotlin]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Require a successful stage
        env:
          STAGE_RESULT: ${{ needs.kotlin.result }}
        run: test "$STAGE_RESULT" = success
