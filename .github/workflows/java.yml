name: java

on:
  push:
    branches: main
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Print extra diagnostics (never secret values)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

defaults:
  run:
    working-directory: java

jobs:
  findChangedJavaFiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    outputs:
      isJavaFilesChanged: ${{ steps.setIsJavaFilesChangedOutput.outputs.isJavaFilesChanged }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get changed files using defaults
        id: changed-files
        uses: tj-actions/changed-files@v47
      - name: Set output isJavaFilesChanged
        id: setIsJavaFilesChangedOutput
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          isJavaFilesChanged='false'
          # workflow_dispatch has no diff to inspect, so treat it as "changed".
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            isJavaFilesChanged='true'
          fi
          echo "Changed files: $ALL_CHANGED_FILES"
          for changedFile in $ALL_CHANGED_FILES; do
            if [[ $changedFile == java/* ]] || [[ $changedFile == .github/workflows/java.yml ]]; then
              isJavaFilesChanged='true'
              break
            fi
          done
          echo "isJavaFilesChanged=${isJavaFilesChanged}" >> $GITHUB_OUTPUT
          echo "isJavaFilesChanged: ${isJavaFilesChanged}"

  build:
    needs: [findChangedJavaFiles]
    if: ${{ needs.findChangedJavaFiles.outputs.isJavaFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B compile --file pom.xml

  test:
    needs: [findChangedJavaFiles, build]
    if: ${{ needs.findChangedJavaFiles.outputs.isJavaFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.java }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        java: ['11', '17', '21']
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven
      - name: Test with Maven
        run: mvn -B test --file pom.xml

  format:
    needs: [findChangedJavaFiles]
    if: ${{ needs.findChangedJavaFiles.outputs.isJavaFilesChanged == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-format
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Check formatting with Spotless
        run: mvn -B spotless:check --file pom.xml

  publishToMavenCentral:
    needs: [findChangedJavaFiles, test, format]
    if: ${{ needs.findChangedJavaFiles.outputs.isJavaFilesChanged == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-publish-maven-central
      cancel-in-progress: false
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.version-check.outputs.version }}
      group: ${{ steps.version-check.outputs.group }}
      artifact: ${{ steps.version-check.outputs.artifact }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # Maven Central has no OIDC trusted publishing (unlike npm, PyPI and
      # crates.io), so the long-lived Portal token and GPG key are the only
      # option. They are read through `env` rather than interpolated into the
      # script body, where the values would end up in the runner's shell.
      - name: Check publishing credentials
        id: creds
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$CENTRAL_USERNAME" ] && [ -n "$CENTRAL_TOKEN" ] && [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "have_creds=true" >> $GITHUB_OUTPUT
            echo "Maven Central credentials: present"
          else
            echo "have_creds=false" >> $GITHUB_OUTPUT
            echo "::warning::Skipping Maven Central publishing: CENTRAL_USERNAME, CENTRAL_TOKEN, GPG_PRIVATE_KEY and GPG_PASSPHRASE secrets are not configured. Generate a token at https://central.sonatype.com/account and add these repository secrets to enable publishing. No GitHub release will be created."
          fi
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check if version already published
        id: version-check
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          PACKAGE_GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          PACKAGE_ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "group=$PACKAGE_GROUP" >> $GITHUB_OUTPUT
          echo "artifact=$PACKAGE_ARTIFACT" >> $GITHUB_OUTPUT
          echo "Package: $PACKAGE_GROUP:$PACKAGE_ARTIFACT:$PACKAGE_VERSION"

          URL="https://repo1.maven.org/maven2/$(echo "$PACKAGE_GROUP" | tr '.' '/')/$PACKAGE_ARTIFACT/$PACKAGE_VERSION/"
          if curl --head --silent --fail "$URL" > /dev/null 2>&1; then
            echo "Version $PACKAGE_VERSION already exists on Maven Central"
            echo "should_publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION does not exist on Maven Central"
            echo "should_publish=true" >> $GITHUB_OUTPUT
          fi
      - name: Publish to Maven Central
        id: publish
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ "${{ steps.creds.outputs.have_creds }}" != "true" ]; then
            echo "published=failed" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "${{ steps.version-check.outputs.should_publish }}" != "true" ]; then
            echo "published=skipped" >> $GITHUB_OUTPUT
            echo "::notice::Version ${{ steps.version-check.outputs.version }} is already on Maven Central, nothing to publish"
            exit 0
          fi
          mvn -B deploy -Prelease --file pom.xml
          echo "published=true" >> $GITHUB_OUTPUT
      # `autoPublish` hands the bundle to the Portal, which validates and
      # syncs it asynchronously, so a successful `mvn deploy` is not yet a
      # published artifact. Nothing is released until it is really there.
      - name: Verify the artifact is really on Maven Central
        if: steps.publish.outputs.published == 'true'
        env:
          PACKAGE_GROUP: ${{ steps.version-check.outputs.group }}
          PACKAGE_ARTIFACT: ${{ steps.version-check.outputs.artifact }}
          PACKAGE_VERSION: ${{ steps.version-check.outputs.version }}
        run: |
          set -euo pipefail
          GROUP_PATH=$(echo "$PACKAGE_GROUP" | tr '.' '/')
          URL="https://repo1.maven.org/maven2/${GROUP_PATH}/${PACKAGE_ARTIFACT}/${PACKAGE_VERSION}/${PACKAGE_ARTIFACT}-${PACKAGE_VERSION}.pom"
          for attempt in $(seq 1 30); do
            if curl --head --silent --fail "$URL" > /dev/null 2>&1; then
              echo "Verified ${PACKAGE_GROUP}:${PACKAGE_ARTIFACT}:${PACKAGE_VERSION} on Maven Central (attempt ${attempt})"
              exit 0
            fi
            echo "Not synced yet, retrying in 30s (attempt ${attempt}/30)"
            sleep 30
          done
          echo "::error::${PACKAGE_GROUP}:${PACKAGE_ARTIFACT}:${PACKAGE_VERSION} did not appear on Maven Central within 15 minutes"
          exit 1

  publishRelease:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [findChangedJavaFiles, publishToMavenCentral]
    # See csharp.yml: gate on what was published, not on the job result.
    if: ${{ needs.findChangedJavaFiles.outputs.isJavaFilesChanged == 'true' && needs.publishToMavenCentral.outputs.published == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      # The version is taken from the publish job's output instead of being
      # re-evaluated with Maven, which needed a whole JDK just to read a
      # number that the previous job already knew.
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE_GROUP: ${{ needs.publishToMavenCentral.outputs.group }}
          PACKAGE_ARTIFACT: ${{ needs.publishToMavenCentral.outputs.artifact }}
          PACKAGE_VERSION: ${{ needs.publishToMavenCentral.outputs.version }}
        run: |
          set -euo pipefail
          TAG="java_${PACKAGE_VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --title "[Java] $PACKAGE_VERSION" \
            --notes "https://central.sonatype.com/artifact/$PACKAGE_GROUP/$PACKAGE_ARTIFACT/$PACKAGE_VERSION"
