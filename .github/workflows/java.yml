name: java

on:
  workflow_call:
    inputs:
      verbose:
        description: "Print extra diagnostics (never secret values)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

defaults:
  run:
    working-directory: java

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: ci-java-${{ github.ref }}-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: ./mvnw -B compile --file pom.xml

  test:
    needs: [build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: ci-java-${{ github.ref }}-test-${{ matrix.java }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        # The pom.xml release floor, the current LTS, and the newest release.
        java: ["21", "25", "27"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6.1.0
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: maven
      - name: Test with Maven
        run: ./mvnw -B test --file pom.xml

  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-java-${{ github.ref }}-format
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Set up JDK 25
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven
      - name: Check Google Java formatting and whitespace
        run: bash format.sh --check && ./mvnw -B spotless:check --file pom.xml
