name: dependency freshness

on:
  pull_request:
  push:
    branches: main
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  latest-stable:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its base (HEAD^1).
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.15'
      - name: Test the dependency checker without network access
        run: python experiments/issue-325/test_dependency_check.py
      # A manifest Dependabot is not told about never receives an update; the
      # old config missed 35 committed manifests (issue #348). A label it is
      # told to apply has to exist, or it is silently dropped (issue #350).
      - name: Require a Dependabot entry for every committed manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python experiments/issue-348/test_dependabot_check.py
          python scripts/ci/check-dependabot.py
      # A pull request fails only for the declarations it adds or changes;
      # every other outdated one is printed as a note. Gating each Dependabot
      # pull request on every other package kept all of them red (issue #350).
      # On main (push, schedule, dispatch) an outdated declaration is a
      # warning: a newer upstream release is not caused by the commit, and
      # failing for it kept main red with no change (issue #377, best
      # practice 17). Registry errors fail on every event.
      - name: Require current stable dependencies and actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'pull_request' && '--changed-since=HEAD^1' || '--warn-only' }}
        run: python scripts/ci/check-dependencies.py "$MODE"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest
      - name: Report stale transitive npm dependencies and require both JS locks
        env:
          ADVISORY: ${{ github.event_name == 'pull_request' && '--advisory' || '' }}
        run: node scripts/ci/check-npm-locks.mjs ${ADVISORY:+"$ADVISORY"}
      - name: Preserve dependency resolution evidence
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-check-logs
          path: ci-logs/dependencies/
          if-no-files-found: ignore
