name: js

on:
  workflow_call:
    inputs:
      verbose:
        description: "Print extra diagnostics (never secret values)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

defaults:
  run:
    working-directory: js

jobs:
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-js-${{ github.ref }}-format
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      # Uses the pinned devDependency rather than `npx prettier`, which would
      # silently resolve a different version on every run.
      - name: Check formatting with Prettier
        run: bun run format:check

  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    concurrency:
      group: ci-js-${{ github.ref }}-lint
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    concurrency:
      group: ci-js-${{ github.ref }}-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      # A peggy update changes the generated code without touching the
      # grammar, so a Dependabot bump of peggy fails here until the parser is
      # regenerated on its branch.
      - name: Verify generated parser matches its grammar
        run: |
          if ! git diff --exit-code -- src/parser-generated.js; then
            echo "::error file=js/src/parser-generated.js::The committed parser differs from src/grammar.pegjs built with the locked peggy ($(bunx peggy --version)). Run 'bun install && bun run build' in js/ and commit src/parser-generated.js and dist/index.js."
            exit 1
          fi
      - name: Test
        run: bun test
      - name: Check binary API TypeScript declarations
        run: bunx tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler ../examples/binary/typescript.ts
      - name: Check indented document API TypeScript declarations
        run: bunx tsc --ignoreConfig --noEmit --strict --target ES2022 --module ESNext --moduleResolution bundler ../examples/js_indented_document.ts

  parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.4
      - name: Check every CI entry point and parity contract
        working-directory: .
        run: |
          bun scripts/ci/check-js-gate.mjs
          bun test experiments/issue-339/ci-contract.test.mjs
          node scripts/ci/check-parity.mjs
          node scripts/version-consistency.mjs
          node scripts/ci/php-distribution.mjs
          node --test experiments/issue-339/parity-contract.test.mjs
          node --test experiments/issue-339/release-audit.test.mjs
          node --test experiments/issue-192/*.test.mjs
          node --test experiments/issue-339/php-distribution.test.mjs
          node --test experiments/issue-408/actions-migration.test.mjs
          python3 experiments/issue-339/test_workflow_contract.py
      - name: Check archived npm setup compatibility
        working-directory: .
        timeout-minutes: 3
        run: |
          npm ci --prefix dev/log/issues/330/pulls/331/templates/js --ignore-scripts --no-audit --no-fund
          npm ci --prefix dev/log/issues/377/pulls/378/templates/js --ignore-scripts --no-audit --no-fund
          node --test --test-timeout=30000 experiments/issue-408/inline-tools.test.mjs dev/log/issues/330/pulls/331/templates/js/tests/use-module-integration.test.js
      - name: Verify archived artifact glob migrations with real files
        working-directory: .
        run: |
          npm ci --ignore-scripts --prefix dev/log/issues/377/pulls/378/templates/js/.github/actions/artifact-transport
          npm ci --ignore-scripts --prefix dev/log/issues/377/pulls/378/templates/python/.github/actions/artifact
          node --test experiments/issue-405/artifact-files.test.mjs
