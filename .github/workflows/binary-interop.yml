name: binary interoperability

on:
  workflow_call:
    inputs:
      verbose:
        description: 'Print extra diagnostics (never secret values)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ci-binary-interop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  seven-languages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go/go.mod
          # The module has no dependencies (no go.sum), so the default cache
          # only produced "Restore cache failed: Dependencies file is not
          # found" on every run (issue #330). go.yml disables it for the same
          # reason.
          cache: false
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring
          tools: composer
      - name: Install PHP autoloader
        run: composer install --working-dir=php --no-dev --no-interaction
      - name: Compare bytes and decoded text in all seven languages
        run: bash examples/binary/run-interop.sh
