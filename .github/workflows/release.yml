name: release

on:
  workflow_call:
    inputs:
      verbose:
        description: "Print extra diagnostics (never secret values)"
        type: boolean
        required: false
        default: false
    secrets:
      NPM_TOKEN:
        required: false
      CARGO_TOKEN:
        required: false
      PYPI_TOKEN:
        required: false
      CENTRAL_USERNAME:
        required: false
      CENTRAL_TOKEN:
        required: false
      GPG_PRIVATE_KEY:
        required: false
      GPG_PASSPHRASE:
        required: false
      NUGET_API_KEY:
        required: false
      NUGET_TOKEN:
        required: false
      PACKAGIST_USERNAME:
        required: false
      PACKAGIST_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  js:
    uses: ./.github/workflows/publish-js.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: write
      id-token: write

  rust:
    uses: ./.github/workflows/publish-rust.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
    permissions:
      contents: write
      id-token: write

  python:
    uses: ./.github/workflows/publish-python.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    permissions:
      contents: write
      id-token: write

  java:
    uses: ./.github/workflows/publish-java.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    permissions:
      contents: write
      id-token: write

  go:
    uses: ./.github/workflows/publish-go.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    permissions:
      contents: write
      id-token: write

  csharp:
    uses: ./.github/workflows/publish-csharp.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      NUGET_TOKEN: ${{ secrets.NUGET_TOKEN }}
    permissions:
      contents: write
      id-token: write

  php:
    uses: ./.github/workflows/publish-php.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    secrets:
      PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
      PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
    permissions:
      contents: write
      id-token: write

  cpp:
    uses: ./.github/workflows/publish-cpp.yml
    with:
      verbose: ${{ inputs.verbose || false }}
    permissions:
      contents: write
      id-token: write
