name: links

on:
  push:
    branches: main
    paths:
      - '**.md'
      - '.lycheeignore'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  pull_request:
    paths:
      - '**.md'
      - '.lycheeignore'
      - 'lychee.toml'
      - '.github/workflows/links.yml'
  # Links rot without anyone touching the repository, so check them weekly too.
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Print extra diagnostics (never secret values)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  CI_VERBOSE: ${{ inputs.verbose && 'true' || vars.CI_VERBOSE || 'false' }}

jobs:
  linkChecker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-link-checker
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    env:
      LYCHEE_ARGS: >-
        --no-progress
        --cache
        --max-cache-age 1d
        --max-retries 3
        --timeout 30
        --exclude-path docs/case-studies
        --exclude-path docs/website/dist
        --exclude-path js/node_modules
        --exclude-path docs/website/node_modules
        './**/*.md'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # docs/case-studies quotes documents from other repositories, and
      # docs/website/dist is generated output whose asset URLs are only valid
      # once the site is served. node_modules is excluded because `./**/*.md`
      # would otherwise check every dependency's README: a local run picked up
      # 4271 links, of which 3400 came from there and ~400 were dead links in
      # third-party packages we do not control. Nothing installs dependencies
      # in this job today, so the exclusions are a guard against that changing.
      # Known false positives live in .lycheeignore, which lychee picks up
      # automatically.
      - name: Check links with lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: false
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # lychee retries a 429 but never a 5xx answer: a rejected status code only
      # counts as retryable when it is 429 (ErrorKind::should_retry in
      # lychee-lib/src/retry.rs). So a short outage failed the scheduled run of
      # 2026-10-05 on four codefactor.io 503s and two github.com 502s, with
      # every link working again minutes later (issue #330). Check once more
      # after a pause. lychee never caches a failure, so with --cache this pass
      # only re-requests the links that failed, and a real 404 fails it again.
      # Reproduce with experiments/issue-330/lychee-5xx-retry.sh.
      - name: Wait before re-checking the failed links
        if: steps.lychee.outputs.exit_code != '0'
        run: sleep 120
      - name: Re-check the failed links
        if: steps.lychee.outputs.exit_code != '0'
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: true
          jobSummary: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
