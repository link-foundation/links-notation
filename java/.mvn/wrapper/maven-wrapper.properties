# The Maven every build of java/ and benchmarks/java uses: ./mvnw downloads it
# once into ~/.m2/wrapper and checks it against the SHA-256 below, so local and
# CI builds no longer run whatever Maven the runner image happens to ship
# (issue #348). Dependabot's maven ecosystem and scripts/ci/check-dependencies.py
# both track distributionUrl. On a bump, take the new checksum from
# https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/<version>/
# (the .sha512 there, then sha256sum of the verified archive).
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip
distributionSha256Sum=1f6d9909266510f039f59aa0e13dcd2c66da85f043e56276e41f2918f8bddaff
