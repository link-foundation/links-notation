[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "links-notation"
version = "0.27.0"
description = "Python implementation of the Links Notation parser"
readme = "README.md"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [
    {name = "Link.Foundation", email = "drakonard@gmail.com"}
]
keywords = ["lino", "parser", "links", "notation", "protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing",
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=9.1.1", "pytest-timeout>=2.4.0"]
lint = ["black>=26.10.1", "isort>=9.0.2", "flake8>=7.4.1"]
dev = ["links-notation[test,lint]"]

[project.urls]
Homepage = "https://github.com/link-foundation/links-notation"
Repository = "https://github.com/link-foundation/links-notation"
Issues = "https://github.com/link-foundation/links-notation/issues"

[tool.setuptools]
packages = ["links_notation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 60
timeout_func_only = true

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313", "py314", "py315"]

[tool.isort]
profile = "black"
line_length = 120
