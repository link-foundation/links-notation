repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Preserve empty TSV fields and original archived patch context.
        exclude: ^(parity/text-vectors\.tsv|docs/case-studies/issue-339/data/.*\.diff)$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  # JavaScript/TypeScript
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.13.0
    hooks:
      - id: eslint
        # The files `npm run lint` covers in the two projects with an
        # eslint.config.*; ESLint 10 finds each file's config from its directory.
        files: ^(js/(src|tests)|docs/website)/.*\.(js|mjs)$
        args: ['--fix']
        additional_dependencies:
          - eslint@10.13.0

  # Python
  - repo: https://github.com/psf/black
    rev: 26.10.1
    hooks:
      - id: black
        language_version: python3
        files: \.py$

  - repo: https://github.com/PyCQA/isort
    rev: 9.0.2
    hooks:
      - id: isort
        files: \.py$

  - repo: https://github.com/PyCQA/flake8
    rev: 7.4.1
    hooks:
      - id: flake8
        files: \.py$
        args: ['--max-line-length=120']

  # Rust
  - repo: https://github.com/doublify/pre-commit-rust
    rev: v1.0
    hooks:
      - id: fmt
      - id: cargo-check
      - id: clippy

  # Markdown
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ['--fix']
