name: Workflow checks

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  workflows:
    name: Lint and test workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-workflows
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Test workflow policy
        run: bun test ./scripts

      - name: Require explicit hosted runner images
        run: |
          if grep -nE '^\s*(runs-on:|os:|-)\s.*(ubuntu|windows|macos)-latest' .github/workflows/*.yml; then
            echo "::error::Pin hosted runners to an explicit image"
            exit 1
          fi

      - name: Check dependency freshness and pin integrity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/ci/check-dependencies.mjs

      # The container bundles ShellCheck, so run blocks are checked as well.
      # actionlint 1.7.12 predates GitHub's `concurrency.queue` key. Keep the
      # suppression narrow so every other workflow/schema diagnostic fails CI.
      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color -ignore queue
