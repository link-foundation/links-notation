name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changeset-pr
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least-privilege default for every job that does not declare its own block
# (zizmor excessive-permissions); the release jobs below escalate individually.
permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: true
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    outputs:
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CSHARP_ROOT: ${{ steps.csharp_layout.outputs.root }}
        run: bun run "${{ steps.csharp_layout.outputs.root }}/scripts/detect-code-changes.mjs"

  # === CHANGESET CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changesets
  changeset-check:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-changeset-check
      cancel-in-progress: true
    name: Changeset Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Validate changeset
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CSHARP_ROOT: ${{ steps.csharp_layout.outputs.root }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          # Run changeset validation script
          bun run "$CSHARP_ROOT/scripts/validate-changeset.mjs"

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changeset-check - it's a fast check that should always run
  # See: https://github.com/link-foundation/js-ai-driven-development-pipeline-template/pull/18 for why this dependency was removed
  lint:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [detect-changes, release-preflight]
    # detect-changes is intentionally skipped for workflow_dispatch. Without a
    # status-check function, GitHub adds an implicit success() on detect-changes
    # and skips lint (and everything that needs it, including instant-release).
    # always() && !cancelled() lets the OR conditions decide instead.
    if: |
      always() && !cancelled() && needs.release-preflight.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Restore dependencies
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 600 "dotnet restore (lint)" dotnet restore

      - name: Check formatting
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 600 "dotnet format (lint)" dotnet format --verify-no-changes --verbosity diagnostic

      - name: Build with warnings as errors
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 700 "dotnet build (lint)" dotnet build --no-restore --configuration Release /warnaserror

      - name: Install helper dependencies
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bun install --frozen-lockfile

      - name: Run script tests
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 300 "Script tests" bun test scripts/*.test.mjs

      - name: Check file size limit
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bun run scripts/check-file-size.mjs

  # === TEST ON MULTIPLE OS ===
  test:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-test-${{ matrix.os }}
      cancel-in-progress: true
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [detect-changes, release-preflight]
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    # Run tests only for events or file changes that affect runtime behavior.
    if: |
      always() && !cancelled() && needs.release-preflight.result == 'success' && (
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        shell: bash
        run: bash scripts/run-with-budget-warning.sh 600 "dotnet restore (test)" dotnet restore

      - name: Build
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        shell: bash
        run: bash scripts/run-with-budget-warning.sh 700 "dotnet build (test)" dotnet build --no-restore --configuration Release

      - name: Run tests
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        shell: bash
        # This matrix also runs on windows-2025, where the default shell is
        # pwsh: `shell: bash` keeps the wrapper (and its process-group
        # signalling) working on every leg.
        run: bash scripts/run-with-budget-warning.sh 1200 "Test suite" dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Skip Codecov upload when token is unavailable
        if: matrix.os == 'ubuntu-24.04' && env.CODECOV_TOKEN == ''
        run: echo "::notice::CODECOV_TOKEN is not configured; skipping Codecov upload."

      - name: Resolve exact coverage reports
        id: coverage_reports
        if: matrix.os == 'ubuntu-24.04' && env.CODECOV_TOKEN != ''
        shell: bash
        env:
          CSHARP_ROOT: ${{ steps.csharp_layout.outputs.root }}
        run: |
          reports=$(find "$CSHARP_ROOT/tests" -type f -name coverage.cobertura.xml -path '*/TestResults/*')
          if [ -z "$reports" ]; then
            echo '::error::No generated Cobertura reports found under tests/TestResults.'
            exit 1
          fi
          files=$(printf '%s\n' "$reports" | paste -sd, -)
          printf 'files=%s\n' "$files" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codecov
        # A `uses:` step cannot be wrapped by run-with-budget-warning.sh, so it
        # declares its deadline with a step-level timeout-minutes: an exhausted
        # step budget fails the step, while an exhausted job cap only cancels
        # the job.
        timeout-minutes: 5
        if: matrix.os == 'ubuntu-24.04' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true
          directory: ${{ steps.csharp_layout.outputs.root }}/tests
          plugins: noop
          files: ${{ steps.coverage_reports.outputs.files }}
          disable_search: true

  codecov-token:
    name: Check Codecov token
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Codecov configuration on main
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -z "$CODECOV_TOKEN" ]; then
            echo "::error::Set CODECOV_TOKEN in Settings > Secrets and variables > Actions, then rerun. Coverage upload is required on main."
            exit 1
          fi

  # === BUILD PACKAGE ===
  # Only runs if lint and test pass
  build:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-build
      cancel-in-progress: true
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test]
    if: always() && needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore dependencies
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 600 "dotnet restore (build)" dotnet restore

      - name: Build Release
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 700 "dotnet build (build)" dotnet build --no-restore --configuration Release

      - name: Pack NuGet package
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: bash scripts/run-with-budget-warning.sh 600 "dotnet pack" dotnet pack --no-build --configuration Release --output ./artifacts

      - name: Upload artifacts
        # A `uses:` step cannot be wrapped by run-with-budget-warning.sh, so it
        # declares its deadline with a step-level timeout-minutes: an exhausted
        # step budget fails the step, while an exhausted job cap only cancels
        # the job.
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: nuget-package
          path: ${{ steps.csharp_layout.outputs.root }}/artifacts/*.nupkg

  # === RELEASE PREFLIGHT ===
  # Attempt OIDC and check readable repository identity and package visibility
  # before expensive builds/tests. GitHub write capability and exact package
  # push authorization remain unverified until actual writes. Release mode
  # (main push/dispatch) rejects known failures before the matrix; pull requests
  # report without blocking because forks legitimately lack release secrets.
  release-preflight:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-release-preflight
      cancel-in-progress: true
    name: Release Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: NuGet login (preflight OIDC)
        id: nuget-login
        if: vars.NUGET_USER != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Probe every release precondition
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        env:
          PREFLIGHT_MODE: >-
            ${{
              (
                (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
                (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
              ) && 'release' || 'report'
            }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && secrets.NUGET_API_KEY || '' }}
          NUGET_USER: ${{ vars.NUGET_USER }}
          NUGET_OIDC_OUTCOME: ${{ steps.nuget-login.outcome }}
          NUGET_OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: bun run scripts/preflight-credentials.mjs

  # === AUTOMATIC RELEASE ===
  # Runs on push to main using changesets
  release:
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Release
    needs: [lint, test, build, release-preflight]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.lint.result == 'success' && needs.test.result == 'success' && needs.build.result == 'success' && needs.release-preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      # This checkout keeps credentials in .git/config on purpose:
      # scripts/version-and-commit.mjs runs `git push` to publish the version
      # bump, which needs the token wired into the remote. Every other
      # checkout in this repository sets persist-credentials: false (issue
      # #54).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Check for changesets
        id: check_changesets
        run: |
          # Count changeset files (excluding README.md and config.json)
          CHANGESET_DIR="${{ steps.csharp_layout.outputs.root }}/.changeset"
          CHANGESET_COUNT=$(find "$CHANGESET_DIR" -name "*.md" ! -name "README.md" 2>/dev/null | wc -l)
          echo "Found $CHANGESET_COUNT changeset file(s)"
          echo "has_changesets=$([[ $CHANGESET_COUNT -gt 0 ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          echo "changeset_count=$CHANGESET_COUNT" >> "$GITHUB_OUTPUT"

      - name: Check if release is needed
        # Self-healing gate: even when a changeset is absent, resume publishing
        # if the csproj <Version> is missing on NuGet or its GitHub release does
        # not exist. See issue #11 and the JS template's check-release-needed.mjs
        # for the same pattern.
        id: check_release
        env:
          HAS_CHANGESETS: ${{ steps.check_changesets.outputs.has_changesets }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CSHARP_ROOT: ${{ steps.csharp_layout.outputs.root }}
        run: |
          bun run "${{ steps.csharp_layout.outputs.root }}/scripts/check-release-needed.mjs" \
            --csharp-root "${{ steps.csharp_layout.outputs.root }}"

      - name: Merge multiple changesets
        if: steps.check_changesets.outputs.has_changesets == 'true' && steps.check_changesets.outputs.changeset_count > 1
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          echo "Multiple changesets detected, merging..."
          bun run scripts/merge-changesets.mjs

      - name: Version and commit
        if: steps.check_changesets.outputs.has_changesets == 'true'
        id: version
        run: |
          bash scripts/run-with-budget-warning.sh 600 "Version bump and push" \
            bun run "${{ steps.csharp_layout.outputs.root }}/scripts/version-and-commit.mjs" \
            --mode changeset \
            --csharp-root "${{ steps.csharp_layout.outputs.root }}"

      - name: Resolve release version
        # Picks the version that downstream steps should publish. Prefers the
        # one just committed; falls back to the csproj <Version> reported by
        # check-release-needed for self-healing re-runs.
        id: release_version
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true')
        run: |
          if [ -n "${{ steps.version.outputs.new_version }}" ]; then
            VERSION="${{ steps.version.outputs.new_version }}"
          else
            VERSION="${{ steps.check_release.outputs.current_version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $VERSION"

      - name: Build release package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true')
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          bash scripts/run-with-budget-warning.sh 1200 "Release package build" bash -c '
            set -euo pipefail
            dotnet restore
            dotnet build --configuration Release
            dotnet test --no-build --configuration Release
            dotnet pack --no-build --configuration Release --output ./artifacts
          '

      - name: Resolve NuGet package id
        id: package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true')
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          PACKAGE_ID=$(dotnet msbuild src/MyPackage/MyPackage.csproj -getProperty:PackageId | tail -n 1 | tr -d '\r')
          if [ -z "$PACKAGE_ID" ]; then
            PACKAGE_ID=$(dotnet msbuild src/MyPackage/MyPackage.csproj -getProperty:AssemblyName | tail -n 1 | tr -d '\r')
          fi
          if [ -z "$PACKAGE_ID" ]; then
            PACKAGE_ID="MyPackage"
          fi
          echo "id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"

      - name: NuGet login (OIDC)
        id: nuget-login
        continue-on-error: true
        # Request the one-hour key after building, immediately before pushing.
        if: >-
          vars.NUGET_USER != '' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true'))
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        id: nuget_publish
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true')
        env:
          NUGET_OIDC_OUTCOME: ${{ steps.nuget-login.outcome }}
          NUGET_OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_ID: ${{ steps.package.outputs.id }}
          PACKAGE_VERSION: ${{ steps.release_version.outputs.version }}
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          bash scripts/run-with-budget-warning.sh 600 "NuGet publish" \
            bun run scripts/push-nuget-package.mjs

      - name: Wait for NuGet indexing
        # NuGet's flat-container API can take up to 15 minutes to reflect a
        # newly pushed package (see issue #13). Poll it via the tested helper
        # before creating the GitHub release so users can `dotnet add package`
        # the version mentioned in the release notes.
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true'))
        run: |
          bash scripts/run-with-budget-warning.sh 1200 "NuGet indexing wait" \
            bun run "${{ steps.csharp_layout.outputs.root }}/scripts/wait-for-nuget.mjs" \
            --package-id "${{ steps.package.outputs.id }}" \
            --release-version "${{ steps.release_version.outputs.version }}"

      - name: Smoke-test published NuGet package
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        # Indexing proves the version exists; this installs it in a clean
        # throwaway project and runs the advertised library entry point before
        # release notes are published. The helper captures command output
        # before previewing it, avoiding SIGPIPE-prone live-output pagination.
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true'))
        run: |
          bash scripts/run-with-budget-warning.sh 600 "NuGet smoke test" \
            bun run scripts/smoke-test-nuget-package.mjs \
            --package-id "${{ steps.package.outputs.id }}" \
            --release-version "${{ steps.release_version.outputs.version }}"

      - name: Create GitHub Release
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true' ||
          (steps.check_release.outputs.should_release == 'true' &&
           steps.check_release.outputs.skip_bump == 'true'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run "${{ steps.csharp_layout.outputs.root }}/scripts/create-github-release.mjs" \
            --release-version "${{ steps.release_version.outputs.version }}" \
            --repository "${{ github.repository }}" \
            --csharp-root "${{ steps.csharp_layout.outputs.root }}" \
            --language "C#" \
            --package-id "${{ steps.package.outputs.id }}" \
            --assets-glob "./artifacts/*.nupkg"

  # === MANUAL INSTANT RELEASE ===
  # Triggered via workflow_dispatch with instant mode
  instant-release:
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Instant Release
    needs: [lint, test, build, release-preflight]
    # Mirror the automatic release job: a status-check function plus explicit
    # needs.*.result checks so the dispatch run is evaluated even though
    # detect-changes (an upstream skip) propagated through the needs graph.
    if: |
      always() && !cancelled() &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.release-preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      # This checkout keeps credentials in .git/config on purpose:
      # scripts/version-and-commit.mjs runs `git push` to publish the version
      # bump, which needs the token wired into the remote. Every other
      # checkout in this repository sets persist-credentials: false (issue
      # #54).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Version and commit
        id: version
        # The dispatch inputs reach the script through env, never through ${{ }}
        # in the script body: an interpolated expression is spliced into the
        # program before the shell parses it, so quoting does not help
        # (zizmor template-injection).
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          bash scripts/run-with-budget-warning.sh 600 "Version bump and push" \
            bun run "${{ steps.csharp_layout.outputs.root }}/scripts/version-and-commit.mjs" \
            --mode instant \
            --bump-type "$BUMP_TYPE" \
            --description "$DESCRIPTION" \
            --csharp-root "${{ steps.csharp_layout.outputs.root }}"

      - name: Build package
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          bash scripts/run-with-budget-warning.sh 1200 "Release package build" bash -c '
            set -euo pipefail
            dotnet restore
            dotnet build --configuration Release
            dotnet test --no-build --configuration Release
            dotnet pack --no-build --configuration Release --output ./artifacts
          '

      - name: Resolve NuGet package id
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        id: package
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          PACKAGE_ID=$(dotnet msbuild src/MyPackage/MyPackage.csproj -getProperty:PackageId | tail -n 1 | tr -d '\r')
          if [ -z "$PACKAGE_ID" ]; then
            PACKAGE_ID=$(dotnet msbuild src/MyPackage/MyPackage.csproj -getProperty:AssemblyName | tail -n 1 | tr -d '\r')
          fi
          if [ -z "$PACKAGE_ID" ]; then
            PACKAGE_ID="MyPackage"
          fi
          echo "id=$PACKAGE_ID" >> "$GITHUB_OUTPUT"

      - name: NuGet login (OIDC)
        id: nuget-login
        continue-on-error: true
        # Request the one-hour key after building, immediately before pushing.
        if: >-
          vars.NUGET_USER != '' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet
        id: nuget_publish
        if: >-
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true'
        env:
          NUGET_OIDC_OUTCOME: ${{ steps.nuget-login.outcome }}
          NUGET_OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          PACKAGE_ID: ${{ steps.package.outputs.id }}
          PACKAGE_VERSION: ${{ steps.version.outputs.new_version }}
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        run: |
          bash scripts/run-with-budget-warning.sh 600 "NuGet publish" \
            bun run scripts/push-nuget-package.mjs

      - name: Wait for NuGet indexing
        # NuGet's flat-container API can take up to 15 minutes to reflect a
        # newly pushed package (see issue #13). Poll it via the tested helper
        # before creating the GitHub release so users can `dotnet add package`
        # the version mentioned in the release notes.
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        run: |
          bash scripts/run-with-budget-warning.sh 1200 "NuGet indexing wait" \
            bun run "${{ steps.csharp_layout.outputs.root }}/scripts/wait-for-nuget.mjs" \
            --package-id "${{ steps.package.outputs.id }}" \
            --release-version "${{ steps.version.outputs.new_version }}"

      - name: Smoke-test published NuGet package
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        # Indexing proves the version exists; this installs it in a clean
        # throwaway project and runs the advertised library entry point before
        # release notes are published. The helper captures command output
        # before previewing it, avoiding SIGPIPE-prone live-output pagination.
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        run: |
          bash scripts/run-with-budget-warning.sh 600 "NuGet smoke test" \
            bun run scripts/smoke-test-nuget-package.mjs \
            --package-id "${{ steps.package.outputs.id }}" \
            --release-version "${{ steps.version.outputs.new_version }}"

      - name: Create GitHub Release
        if: >-
          steps.nuget_publish.outputs.published == 'true' && (
          steps.version.outputs.version_committed == 'true' ||
          steps.version.outputs.already_released == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun run "${{ steps.csharp_layout.outputs.root }}/scripts/create-github-release.mjs" \
            --release-version "${{ steps.version.outputs.new_version }}" \
            --repository "${{ github.repository }}" \
            --csharp-root "${{ steps.csharp_layout.outputs.root }}" \
            --language "C#" \
            --package-id "${{ steps.package.outputs.id }}" \
            --assets-glob "./artifacts/*.nupkg"

  # === MANUAL CHANGESET PR ===
  # Creates a pull request with the changeset for review
  changeset-pr:
    concurrency:
      group: main-writer-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    name: Create Changeset PR
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.inputs.release_mode == 'changeset-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # This checkout keeps credentials in .git/config on purpose:
      # peter-evans/create-pull-request pushes the changeset branch from this
      # worktree. Every other checkout in this repository sets
      # persist-credentials: false (issue #54).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.4'

      - name: Create changeset file
        # The dispatch inputs flow through env and printf arguments, never
        # through ${{ }} inside the script: an interpolated expression is
        # spliced into the program before the shell parses it, so quoting does
        # not help (zizmor template-injection).
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: |
          CHANGESET_ID=$(date +%s)
          CHANGESET_DIR="${{ steps.csharp_layout.outputs.root }}/.changeset"
          mkdir -p "$CHANGESET_DIR"
          CHANGESET_FILE="$CHANGESET_DIR/manual-release-${CHANGESET_ID}.md"

          {
            printf '%s\n' '---'
            printf "'MyPackage': %s\n" "$BUMP_TYPE"
            printf '%s\n' '---'
            printf '%s\n' ''
            printf '%s\n' "${DESCRIPTION:-Manual release}"
          } > "$CHANGESET_FILE"

          echo "Created changeset: $CHANGESET_FILE"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changeset for manual ${{ github.event.inputs.bump_type }} release'
          branch: changeset-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changeset in this PR
            2. Merge this PR to main
            3. The automated release workflow will version, publish, and create a GitHub release

  # === PIPELINE STATUS ===
  # GitHub reports jobs killed by timeout-minutes as cancelled. Observe every
  # job so a timeout on main becomes a visible failure instead of a grey run,
  # and reject missing or unexpectedly skipped required work.
  pipeline-status:
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-pipeline-status
      cancel-in-progress: true
    name: Pipeline Status
    needs:
      - codecov-token
      - detect-changes
      - changeset-check
      - lint
      - test
      - build
      - release-preflight
      - release
      - instant-release
      - changeset-pr
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect C# layout
        id: csharp_layout
        uses: ./.github/actions/csharp-layout

      - name: Check aggregate pipeline status
        working-directory: ${{ steps.csharp_layout.outputs.root }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          EVENT_NAME: ${{ github.event_name }}
          BRANCH_REF_FULL: ${{ github.ref }}
          RELEASE_MODE: ${{ inputs.release_mode }}
          BRANCH_REF: ${{ github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
