name: Workflows

# GitHub Actions ignores unknown workflow keys instead of rejecting them, so a
# typo such as `queue: max` inside a `concurrency:` block silently does nothing
# (issue #62). actionlint validates the schema and, through shellcheck, every
# `run:` block as well.
on:
  push:
    branches:
      - main
    paths:
      - '.github/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Lint Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-actionlint
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # The Docker image bundles shellcheck and pyflakes, so this lints every
      # `run:` block too. A native actionlint binary without shellcheck on
      # PATH silently skips the shell checks and still exits 0 -- worth knowing
      # before trying to reproduce a finding locally.
      #
      # 1.7.12 (issue #71) adds the `glob` check for `paths:` filters that can
      # never match (a workflow filtered with `./src/**` stops running and
      # reports nothing) and knows the modern hosted runner labels, so real
      # labels like macos-15-intel are no longer reported as unknown.
      #
      # Pinned by digest because a mutable tag of a repository we do not
      # control is arbitrary code execution in any job that holds credentials
      # (the same reasoning as the `'*': hash-pin` policy in
      # .github/zizmor.yml; the `unpinned-images` audit that would flag this
      # is Pedantic-persona and runs in the step below). Re-resolve when
      # bumping:
      #   docker pull rhysd/actionlint:<tag> &&
      #   docker inspect --format='{{index .RepoDigests 0}}' rhysd/actionlint:<tag>
      - name: Lint workflow files
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # v1.7.12
        with:
          args: -color

  # actionlint validates workflow schema and shell; it does not detect
  # credential persistence, template injection or unpinned actions. zizmor
  # covers exactly those, so both linters run on every change under .github/.
  # Reproduce locally with:
  #   pipx run zizmor==1.29.0 --min-confidence medium --persona regular \
  #     --config .github/zizmor.yml .github/workflows
  zizmor:
    name: Audit Workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Annotations instead of SARIF: forks of this template do not necessarily
      # have code scanning enabled, and the job should fail loudly either way.
      #
      # `version` is named rather than left at the default, because the
      # action's `latest` entry is its own frozen table (v0.6.2 -> zizmor
      # 1.29.0), not the latest zizmor -- the comment beside this step used to
      # name 1.30.0, a version the action cannot install (issue #76). Naming
      # the version keeps the next bump a visible line in the diff rather than
      # a side effect of bumping the action, and documents exactly which
      # analyser reproduces a finding.
      - name: Audit workflow files
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
          min-confidence: medium
          version: 1.29.0

      # The step above runs `--persona regular`, which is the right default:
      # pedantic surfaces dozens of stylistic findings. But the audits that
      # cover container image references (`unpinned-images` among them) are
      # Pedantic-only, so the `'*': hash-pin` policy declared in
      # .github/zizmor.yml is not enforced against `uses: docker://` or
      # `container:` references by the regular pass. Narrowing this second
      # pass to high severity *and* high confidence keeps that enforcement
      # without importing the noise. Measured: after the digest pin of the
      # actionlint image above it reports nothing, and stays silent until
      # someone reintroduces a mutable image reference (issue #75).
      - name: Audit for pedantic-only high-severity findings
        timeout-minutes: 5
        run: |
          pipx run zizmor==1.29.0 --config .github/zizmor.yml \
            --persona pedantic --min-severity high --min-confidence high \
            .github/workflows

  # Terminal status gate (issue #69): GitHub reports jobs killed by
  # timeout-minutes as cancelled. Observe every other job so a timeout on main
  # becomes a visible failure instead of a grey run, while a run that was
  # superseded by a newer commit is recognised as expected churn.
  pipeline-status:
    name: Pipeline Status
    needs:
      - actionlint
      - zizmor
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
